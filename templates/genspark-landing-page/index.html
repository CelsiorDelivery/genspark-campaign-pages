<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GenSpark Landing Page</title>
  <meta name="description" content="">

  <!-- Canonical GenSpark dependencies -->
  <link rel="stylesheet" href="/shared/genspark/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/shared/genspark/vendor/theme/app.min.css">

  <!-- GenSpark Static Design System -->
  <link rel="stylesheet" href="/shared/genspark/css/genspark-base.css">
  <link rel="stylesheet" href="/shared/genspark/css/genspark-components.css">

  <!-- Page-specific styles -->
  <link rel="stylesheet" href="./page.css">
</head>

<body>

  <!-- DO NOT recreate the GenSpark navbar here -->
  <div id="genspark-navbar"></div>

  <main class="gs-page">

    <!-- PAGE HERO -->
    <section class="gs-section gs-section--dark">
      <div class="gs-container">

        <span class="gs-eyebrow">Page Eyebrow</span>

        <h1>Replace with the page's primary message.</h1>

        <p style="max-width: 760px;">
          Replace with concise supporting copy for this landing page.
        </p>

        <a class="gs-btn gs-btn--light" href="#">
          Primary CTA
        </a>

      </div>
    </section>


    <!-- PAGE CONTENT -->
    <section class="gs-section gs-section--light">
      <div class="gs-container">

        <div class="gs-section-header">
          <span class="gs-eyebrow">Section Eyebrow</span>
          <h2>Replace with a section heading.</h2>
          <p>
            Add page-specific content here while reusing the shared
            GenSpark components wherever appropriate.
          </p>
        </div>

      </div>
    </section>

  </main>

  <!-- DO NOT recreate the GenSpark footer here -->
  <div id="genspark-footer"></div>

  <!-- Canonical GenSpark behavior -->
  <script src="/shared/genspark/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/shared/genspark/js/genspark.js"></script>

  <!-- Page-specific behavior -->
  <script src="./page.js"></script>

</body>
</html>
